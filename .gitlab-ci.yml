# `setup-ci` has no `v1` tag - only `main` - so `version` is pinned to `main` here.
# The upstream template now accepts this as an input (loopress/setup-ci#gitlab/template.yml)
# and installs the `jq`/`gettext` packages scripts/setup-wordpress.sh needs, so no local
# override is required anymore.
include:
  - remote: 'https://raw.githubusercontent.com/loopress/setup-ci/main/gitlab/template.yml'
    inputs:
      version: 'main'

stages:
  - test
  - deploy

test:
  stage: test
  extends: .loopress-bootstrap
  script:
    # plugin push first: installs/activates wpforms-lite, which form push below needs active.
    - lps plugin push
    - lps snippet push
    - lps api push
    - lps acf push
    - lps composer push
    - lps form push
    # Each cookbook-mapped recipe is its own self-contained project (own loopress.json +
    # composer.json), pushed from its own directory. See obsidian/Product/Cookbook
    # Content Pipeline.md.
    - cd post-to-pdf-dompdf-wordpress-rest-api && lps composer push && lps api push && cd ..
    # composer push only installs WooCommerce's files. `lps plugin push` refuses outright
    # whenever a project has its own composer.json (composer.json is authoritative for
    # plugins there), so there is no CLI command for this today. Activate it the same way
    # a human would in wp-admin: the REST endpoint `lps plugin push` itself calls,
    # authenticated with the Application Password setup-ci already issued for `lps`.
    - |
      cd spreadsheet-export-phpspreadsheet-wordpress-rest-api
      lps composer push
      CONFIG="${XDG_CONFIG_HOME:-$HOME/.config}/loopress/config.json"
      TOKEN=$(jq -r '.projects.ci.environments.local.token' "$CONFIG")
      URL=$(jq -r '.projects.ci.environments.local.url' "$CONFIG")
      curl -sf -u "$TOKEN" -X PUT "$URL/wp-json/wp/v2/plugins/woocommerce/woocommerce" \
        -H 'Content-Type: application/json' -d '{"status":"active"}' > /dev/null
      lps api push
      cd ..
    - |
      cd instant-search-algolia-woocommerce-hooks
      lps composer push
      CONFIG="${XDG_CONFIG_HOME:-$HOME/.config}/loopress/config.json"
      TOKEN=$(jq -r '.projects.ci.environments.local.token' "$CONFIG")
      URL=$(jq -r '.projects.ci.environments.local.url' "$CONFIG")
      curl -sf -u "$TOKEN" -X PUT "$URL/wp-json/wp/v2/plugins/woocommerce/woocommerce" \
        -H 'Content-Type: application/json' -d '{"status":"active"}' > /dev/null
      lps hook push
      cd ..

deploy:
  stage: deploy
  extends: .loopress-bootstrap
  script:
    - lps plugin push
    - lps snippet push
    - lps api push
    - lps acf push
    - lps composer push
    - lps form push
    - cd post-to-pdf-dompdf-wordpress-rest-api && lps composer push && lps api push && cd ..
    - |
      cd spreadsheet-export-phpspreadsheet-wordpress-rest-api
      lps composer push
      CONFIG="${XDG_CONFIG_HOME:-$HOME/.config}/loopress/config.json"
      TOKEN=$(jq -r '.projects.ci.environments.local.token' "$CONFIG")
      URL=$(jq -r '.projects.ci.environments.local.url' "$CONFIG")
      curl -sf -u "$TOKEN" -X PUT "$URL/wp-json/wp/v2/plugins/woocommerce/woocommerce" \
        -H 'Content-Type: application/json' -d '{"status":"active"}' > /dev/null
      lps api push
      cd ..
    - |
      cd instant-search-algolia-woocommerce-hooks
      lps composer push
      CONFIG="${XDG_CONFIG_HOME:-$HOME/.config}/loopress/config.json"
      TOKEN=$(jq -r '.projects.ci.environments.local.token' "$CONFIG")
      URL=$(jq -r '.projects.ci.environments.local.url' "$CONFIG")
      curl -sf -u "$TOKEN" -X PUT "$URL/wp-json/wp/v2/plugins/woocommerce/woocommerce" \
        -H 'Content-Type: application/json' -d '{"status":"active"}' > /dev/null
      lps hook push
      cd ..
  needs:
    - test
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
